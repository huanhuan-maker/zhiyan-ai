spring:
  application:
    name: zhiyan-ai
  profiles:
    default: local
server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
