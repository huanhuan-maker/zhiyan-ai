spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:zhiyan_ai}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED&connectTimeout=3000&socketTimeout=5000
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  flyway:
    enabled: true
app:
  admin:
    username: ${APP_ADMIN_USER:researcher}
    password: ${APP_ADMIN_PASSWORD}
